---
name: "🪟 Wails GUI Packaging"

"on":
  # Run only after the primary CLI release is successfully published.
  # This keeps GUI packaging in the same release chain while preserving the
  # native Wails bundle generation step as a second-stage artifact job.
  workflow_run:
    workflows: ["📦 GoReleaser"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to attach GUI assets to"
        required: true
        type: string

permissions: {}

jobs:
  gui:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: "Build and attach native GUI artifacts"
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            asset_glob: "build/bin/*.dmg"
          - os: windows-latest
            target: windows/amd64
            asset_glob: "build/bin/*installer*.exe build/bin/*portable*.zip"
          - os: ubuntu-latest
            target: linux/amd64
            asset_glob: "build/bin/*.tar.gz build/bin/*.deb build/bin/*.rpm build/bin/*.AppImage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: wails-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      UNIRTM_LOCKED: 1
      GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(git tag --points-at "$HEAD_SHA" | head -n 1)"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag points at ${HEAD_SHA}" >&2
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG}"

      - name: Setup UniRTM
        uses: snowdreamtech/setup-unirtm@663cc55933eafea30cd63f43e837cecd4a587f45 # v0.7.0
        with:
          unirtm-version: "0.33.2"
          install: true
          trust: true
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: Cache dependencies and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/AppData/Local/go-build
            ~/.npm
            ~/AppData/Local/npm-cache
          key: ${{ runner.os }}-wails-${{ hashFiles('go.sum', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wails-

      - name: Resolve build metadata
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          COMMIT_FULL="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          MODULE_PATH="$(unirtm exec -- go list -m -f '{{.Path}}')"
          PKG="${MODULE_PATH}/internal/env"
          PROJECT_NAME="${MODULE_PATH##*/}"
          LDFLAGS="-s -w -X '${PKG}.GitTag=${TAG}' -X '${PKG}.CommitHash=${COMMIT}' -X '${PKG}.CommitHashFull=${COMMIT_FULL}' -X '${PKG}.BuildTime=${DATE}' -X '${PKG}.ProjectName=${PROJECT_NAME}'"
          echo "COMMIT=${COMMIT}" >> "$GITHUB_ENV"
          echo "COMMIT_FULL=${COMMIT_FULL}" >> "$GITHUB_ENV"
          echo "DATE=${DATE}" >> "$GITHUB_ENV"
          echo "MODULE_PATH=${MODULE_PATH}" >> "$GITHUB_ENV"
          echo "PKG=${PKG}" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=${PROJECT_NAME}" >> "$GITHUB_ENV"
          echo "LDFLAGS=${LDFLAGS}" >> "$GITHUB_ENV"

      - name: Sync build metadata versions
        shell: bash
        run: unirtm exec -- node scripts/sync-build-metadata.mjs

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libgtk-3-dev
          if ! sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev; then
            echo "libwebkit2gtk-4.0-dev not available, installing libwebkit2gtk-4.1-dev"
            sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
          fi

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          unirtm exec -- npm ci

      - name: Build frontend assets
        shell: bash
        run: |
          cd frontend
          unirtm exec -- npm run build

      - name: Prepare UniGoDesktop App Icon
        shell: bash
        run: unirtm exec -- node scripts/prepare-app-icon.mjs

      - name: Verify frontend build artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "frontend/dist" ] || [ ! -f "frontend/dist/index.html" ]; then
            echo "frontend/dist or frontend/dist/index.html is missing, frontend build failed" >&2
            exit 1
          fi
          echo "Frontend build verified: frontend/dist/index.html exists"

      - name: Build Wails native bundle
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BUILD_TAGS=()
          if [ "${RUNNER_OS}" = "Linux" ] && pkg-config --exists webkit2gtk-4.1 && ! pkg-config --exists webkit2gtk-4.0; then
            BUILD_TAGS+=("-tags" "webkit2_41")
          fi
          mkdir -p build/bin
          unirtm exec -- wails build \
            -s \
            -clean \
            -platform "${TARGET}" \
            ${BUILD_TAGS[@]+"${BUILD_TAGS[@]}"} \
            -ldflags "${LDFLAGS}"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
            if [ -z "${APP_PATH}" ]; then
              echo "Wails build produced no macOS app bundle" >&2
              exit 1
            fi
            EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Contents/Info.plist")"
            APP_BINARY="${APP_PATH}/Contents/MacOS/${EXECUTABLE}"
            if [ ! -s "${APP_BINARY}" ] || [ ! -x "${APP_BINARY}" ]; then
              echo "Wails build completed without a runnable macOS binary: ${APP_BINARY}" >&2
              exit 1
            fi
            file "${APP_BINARY}"
          fi

      - name: Codesign macOS App Bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASS: ${{ secrets.APPLE_CERTIFICATE_PASS }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "No APPLE_CERTIFICATE secret provided, skipping codesign."
            exit 0
          fi
          APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "App bundle not found in build/bin" >&2
            exit 1
          fi
          echo "Signing macOS App Bundle..."
          codesign --force --deep --options runtime --sign "${APPLE_IDENTITY}" "${APP_PATH}"
          codesign --verify --deep --strict "${APP_PATH}"
          echo "macOS App Bundle signature verified"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "App bundle not found in build/bin" >&2
            exit 1
          fi
          APP_NAME="$(basename "${APP_PATH}")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${APP_PATH}/Contents/Info.plist")"
          APP_BINARY="${APP_PATH}/Contents/MacOS/${EXECUTABLE}"
          if [ ! -s "$APP_BINARY" ] || [ ! -x "$APP_BINARY" ]; then
            echo "App bundle has no runnable executable at $APP_BINARY" >&2
            exit 1
          fi
          rm -rf build/bin/dmg-src
          mkdir -p build/bin/dmg-src
          cp -R "$APP_PATH" "build/bin/dmg-src/${APP_NAME}"
          ln -s /Applications "build/bin/dmg-src/Applications"
          hdiutil create -volname "${APP_NAME%.app}" -srcfolder build/bin/dmg-src -ov -format UDZO "build/bin/${APP_NAME%.app}.dmg"
          rm -rf build/bin/dmg-src
          DMG_PATH="build/bin/${APP_NAME%.app}.dmg"
          if [ ! -f "${DMG_PATH}" ]; then
            echo "DMG creation failed: ${DMG_PATH} not found" >&2
            exit 1
          fi
          echo "macOS DMG created successfully: ${DMG_PATH}"

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bin
          unirtm exec -- wails build \
            -s \
            -clean \
            -platform windows/amd64 \
            -nsis \
            -ldflags "${LDFLAGS}"
          INSTALLER="$(find build/bin -maxdepth 1 -name '*installer*.exe' -print -quit 2>/dev/null || true)"
          if [ -z "${INSTALLER}" ] || [ ! -f "${INSTALLER}" ]; then
            INSTALLER="$(find build/bin -maxdepth 1 -name '*.exe' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "${INSTALLER}" ] || [ ! -f "${INSTALLER}" ]; then
            echo "Windows installer executable not found in build/bin" >&2
            exit 1
          fi
          echo "Windows installer produced: ${INSTALLER}"

      - name: Package Windows portable zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          EXE_PATH="$(find build/bin -maxdepth 1 -name 'unigodesktop.exe' -print -quit 2>/dev/null || true)"
          if [ -z "${EXE_PATH}" ] || [ ! -f "${EXE_PATH}" ]; then
            echo "Windows executable unigodesktop.exe not found in build/bin" >&2
            exit 1
          fi
          PORTABLE_DIR="build/bin/unigodesktop-portable"
          mkdir -p "${PORTABLE_DIR}"
          cp "${EXE_PATH}" "${PORTABLE_DIR}/unigodesktop.exe"
          touch "${PORTABLE_DIR}/portable.dat"
          PORTABLE_ZIP="build/bin/unigodesktop-gui_windows_amd64_portable.zip"
          if command -v 7z >/dev/null 2>&1; then
            7z a -tzip "${PORTABLE_ZIP}" "./${PORTABLE_DIR}/*"
          else
            tar -a -c -f "${PORTABLE_ZIP}" -C "${PORTABLE_DIR}" unigodesktop.exe portable.dat
          fi
          rm -rf "${PORTABLE_DIR}"
          if [ ! -f "${PORTABLE_ZIP}" ]; then
            echo "Failed to create portable zip at ${PORTABLE_ZIP}" >&2
            exit 1
          fi
          echo "Windows portable zip produced: ${PORTABLE_ZIP}"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="build/bin/unigodesktop"
          if [ ! -f "$APP_BIN" ]; then
            echo "Linux binary not found at $APP_BIN" >&2
            exit 1
          fi
          mkdir -p build/bin/linux-dist
          cp "$APP_BIN" build/bin/linux-dist/unigodesktop
          cp build/linux/unigodesktop.desktop build/bin/linux-dist/unigodesktop.desktop
          cp build/appicon.png build/bin/linux-dist/unigodesktop.png
          tar -czf build/bin/unigodesktop-gui_linux_amd64.tar.gz -C build/bin/linux-dist unigodesktop unigodesktop.desktop unigodesktop.png
          rm -rf build/bin/linux-dist

      - name: Package Linux packages (deb, rpm, AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_VERSION="${TAG#v}"

          # 1. Package deb and rpm via nfpm
          if ! command -v nfpm >/dev/null 2>&1; then
            echo "Installing nfpm..."
            curl -sfL --retry 3 https://github.com/goreleaser/nfpm/releases/download/v2.41.3/nfpm_2.41.3_Linux_x86_64.tar.gz | tar -xz -C /tmp nfpm
            sudo mv /tmp/nfpm /usr/local/bin/
          fi

          cat << EOF > /tmp/nfpm.yaml
          name: "unigodesktop"
          arch: "amd64"
          platform: "linux"
          version: "${CLEAN_VERSION}"
          section: "utils"
          priority: "optional"
          maintainer: "SnowdreamTech <snowdreamtech@qq.com>"
          description: "Universal Go Desktop Suite"
          vendor: "SnowdreamTech"
          homepage: "https://github.com/snowdreamtech/UniGoDesktop"
          license: "MIT"
          contents:
            - src: "build/bin/unigodesktop"
              dst: "/usr/bin/unigodesktop"
            - src: "build/linux/unigodesktop.desktop"
              dst: "/usr/share/applications/unigodesktop.desktop"
            - src: "build/appicon.png"
              dst: "/usr/share/icons/hicolor/512x512/apps/unigodesktop.png"
          EOF

          nfpm package --config /tmp/nfpm.yaml --packager deb --target "build/bin/unigodesktop-gui_${CLEAN_VERSION}_linux_amd64.deb"
          nfpm package --config /tmp/nfpm.yaml --packager rpm --target "build/bin/unigodesktop-gui_${CLEAN_VERSION}_linux_amd64.rpm"
          rm -f /tmp/nfpm.yaml
          echo "Linux deb and rpm packages created successfully"

          # 2. Package AppImage via appimagetool
          echo "Preparing AppImage..."
          if [ ! -f /tmp/appimagetool ]; then
            curl -sfL --retry 3 -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x /tmp/appimagetool
          fi

          APPDIR="build/bin/AppDir"
          rm -rf "${APPDIR}"
          mkdir -p "${APPDIR}/usr/bin"
          cp build/bin/unigodesktop "${APPDIR}/usr/bin/unigodesktop"
          cp build/linux/unigodesktop.desktop "${APPDIR}/unigodesktop.desktop"
          cp build/appicon.png "${APPDIR}/unigodesktop.png"
          cp build/appicon.png "${APPDIR}/.DirIcon"

          cat << 'EOF' > "${APPDIR}/AppRun"
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/unigodesktop" "$@"
          EOF
          chmod +x "${APPDIR}/AppRun"

          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "${APPDIR}" "build/bin/unigodesktop-gui_${CLEAN_VERSION}_linux_amd64.AppImage"
          rm -rf "${APPDIR}"
          echo "Linux AppImage created successfully"

      - name: Secure GUI artifacts
        env:
          ASSET_GLOB: ${{ matrix.asset_glob }}
          WORKFLOW_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          set -euo pipefail
          MATCHED_ASSETS=()
          for glob_pattern in ${ASSET_GLOB}; do
            for f in ${glob_pattern}; do
              if [ -f "$f" ]; then
                MATCHED_ASSETS+=("$f")
              fi
            done
          done
          if [ "${#MATCHED_ASSETS[@]}" -eq 0 ]; then
            echo "No release asset matched ${ASSET_GLOB}" >&2
            exit 1
          fi

          CHECKSUM_FILE="build/bin/unigodesktop-gui-${RUNNER_OS}.sha256"
          rm -f "${CHECKSUM_FILE}"

          for ASSET in "${MATCHED_ASSETS[@]}"; do
            echo "Securing asset: ${ASSET}"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ASSET}" >> "${CHECKSUM_FILE}"
            else
              shasum -a 256 "${ASSET}" >> "${CHECKSUM_FILE}"
            fi

            syft "file:${ASSET}" -o "spdx-json=${ASSET}.sbom.spdx.json"
            cosign sign-blob --yes \
              --bundle "${ASSET}.sigstore.json" \
              "${ASSET}"
            cosign verify-blob \
              --certificate-identity "${WORKFLOW_IDENTITY}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --bundle "${ASSET}.sigstore.json" \
              "${ASSET}"
          done

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum --check "${CHECKSUM_FILE}"
          else
            shasum -a 256 --check "${CHECKSUM_FILE}"
          fi
          echo "CHECKSUM_FILE=${CHECKSUM_FILE}" >> "$GITHUB_ENV"

      - name: Attest GUI artifact provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: build/bin/unigodesktop-gui-${{ runner.os }}.sha256

      - name: Wait for release to exist
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} is ready"
              exit 0
            fi
            echo "Waiting for release ${TAG} to appear (${i}/30)..."
            sleep 5
          done
          echo "Release ${TAG} was not found after waiting" >&2
          exit 1

      - name: Upload GUI artifacts to GitHub Release
        env:
          ASSET_GLOB: ${{ matrix.asset_glob }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          upload_assets=()
          CHECKSUM_FILE="build/bin/unigodesktop-gui-${RUNNER_OS}.sha256"
          if [ -f "${CHECKSUM_FILE}" ]; then
            upload_assets+=("${CHECKSUM_FILE}")
          fi
          for glob_pattern in ${ASSET_GLOB}; do
            for ASSET in ${glob_pattern}; do
              if [ -f "${ASSET}" ]; then
                upload_assets+=("${ASSET}")
                if [ -f "${ASSET}.sbom.spdx.json" ]; then
                  upload_assets+=("${ASSET}.sbom.spdx.json")
                fi
                if [ -f "${ASSET}.sigstore.json" ]; then
                  upload_assets+=("${ASSET}.sigstore.json")
                fi
              fi
            done
          done
          if [ "${#upload_assets[@]}" -eq 0 ]; then
            echo "No assets found to upload" >&2
            exit 1
          fi
          gh release upload "${TAG}" \
            --repo "${REPOSITORY}" \
            --clobber \
            ${upload_assets[@]+"${upload_assets[@]}"}
