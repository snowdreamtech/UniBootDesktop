name: "🪟 Wails GUI Packaging"

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to attach GUI assets to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  gui:
    name: "Build and attach native GUI artifacts"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/universal
            asset_glob: "build/bin/*.dmg"
          - os: windows-latest
            target: windows/amd64
            asset_glob: "build/bin/*.exe"
          - os: ubuntu-latest
            target: linux/amd64
            asset_glob: "build/bin/*.tar.gz"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    concurrency:
      group: wails-${{ matrix.os }}-${{ github.ref }}
      cancel-in-progress: false
    env:
      UNIRTM_LOCKED: 1
      GH_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${REF_NAME}}"
          if [ -z "$TAG" ]; then
            echo "A release tag is required" >&2
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Release tag: ${TAG}"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2d0f64f794a2daf5be0b89ae6eb40b9 # v4.3.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c4f3b0d9679 # v5.2.0
        with:
          go-version-file: go.mod

      - name: Setup UniRTM
        uses: snowdreamtech/setup-unirtm@663cc55933eafea30cd63f43e837cecd4a587f45 # v0.7.0
        with:
          unirtm-version: "0.31.1"
          install: true
          trust: true
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_SECRET || secrets.GITHUB_TOKEN }}

      - name: Install frontend dependencies
        shell: bash
        run: |
          cd frontend
          npm ci

      - name: Build frontend assets
        shell: bash
        run: |
          cd frontend
          npm run build

      - name: Build Wails native bundle
        shell: bash
        env:
          TAG: ${{ env.TAG }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          TAG="${TAG:-$(git describe --tags --abbrev=0 2>/dev/null || echo dev)}"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
          COMMIT_FULL="$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          PKG="github.com/snowdreamtech/unigodesktop/internal/env"
          mkdir -p build/bin
          unirtm exec -- wails build \
            -platform "${TARGET}" \
            -ldflags "-s -w -X '${PKG}.GitTag=${TAG}' -X '${PKG}.CommitHash=${COMMIT}' -X '${PKG}.CommitHashFull=${COMMIT_FULL}' -X '${PKG}.BuildTime=${DATE}' -X '${PKG}.ProjectName=unigodesktop'"

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/bin/UniGoDesktop.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found at $APP_PATH" >&2
            exit 1
          fi
          mkdir -p build/bin/dmg-src
          cp -R "$APP_PATH" build/bin/dmg-src/UniGoDesktop.app
          hdiutil create -volname "UniGoDesktop" -srcfolder build/bin/dmg-src -ov -format UDZO "build/bin/UniGoDesktop.dmg"

      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ env.TAG }}"
          $commit = "${{ github.sha }}"
          $date = (Get-Date).ToUniversalTime().ToString("o")
          $pkg = "github.com/snowdreamtech/unigodesktop/internal/env"
          $ldflags = "-s -w -X '$pkg.GitTag=$tag' -X '$pkg.CommitHash=$($commit.Substring(0,7))' -X '$pkg.CommitHashFull=$commit' -X '$pkg.BuildTime=$date' -X '$pkg.ProjectName=unigodesktop'"
          unirtm exec -- wails build -platform windows/amd64 -nsis -ldflags "$ldflags"

      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APP_BIN="build/bin/unigodesktop"
          if [ ! -f "$APP_BIN" ]; then
            echo "Linux binary not found at $APP_BIN" >&2
            exit 1
          fi
          tar -czf build/bin/unigodesktop-gui_linux_amd64.tar.gz -C build/bin unigodesktop

      - name: Wait for release to exist
        if: always()
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} is ready"
              exit 0
            fi
            echo "Waiting for release ${TAG} to appear (${i}/30)..."
            sleep 5
          done
          echo "Release ${TAG} was not found after waiting" >&2
          exit 1

      - name: Upload GUI artifacts to GitHub Release
        env:
          ASSET_GLOB: ${{ matrix.asset_glob }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(compgen -G "${ASSET_GLOB}")
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release asset matched ${ASSET_GLOB}" >&2
            exit 1
          fi
          gh release upload "${TAG}" \
            --repo "${REPOSITORY}" \
            --clobber \
            "${assets[@]}"
