<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniGoDesktop</title>
    <!-- Theme pre-load: apply saved theme synchronously before any render to prevent flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('unigo_theme_cache') || 'dark';
          document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Critical inline CSS: prevent flash of white background before theme.css loads */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      :root, [data-theme="dark"] { background-color: #0b0f19; }
      [data-theme="light"] { background-color: #f8fafc; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
